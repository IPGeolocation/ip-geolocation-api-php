name: PHP

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl
          coverage: none

      - name: Validate Composer
        run: composer validate

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction

      - name: Check dependencies
        run: composer audit

      - name: Run unit and HTTP tests
        run: ./vendor/bin/phpunit --exclude-group live --fail-on-warning

      - name: Check Guzzle handlers
        run: |
          for handler in curl stream injected; do
            TEST_HTTP_HANDLER="$handler" ./vendor/bin/phpunit --filter HttpIntegrationTest --fail-on-warning
          done
          php -d allow_url_fopen=0 ./vendor/bin/phpunit --filter HttpIntegrationTest --fail-on-warning
